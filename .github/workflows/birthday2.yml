name: Birthday Email Bot 2
on:
  schedule:
    - cron: "0 0 * * *"
jobs:
  send-emails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: kareena-exe/data-store
          token: ${{ secrets.GHA_PAT }}
          path: data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: node index.js
        env:
          EMAIL_USER: ${{ secrets.USER }}
          EMAIL_PASS: ${{ secrets.PASS_TO_BE_USED }}
